path:
  ckpt_path: output/telugu/ckpt
  log_path: output/telugu/log
  result_path: output/telugu/result
optimizer:
  batch_size: 16
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-09
  weight_decay: 0.0
  grad_clip_thresh: 1.0
  grad_acc_step: 1
  warm_up_step: 4000
  anneal_steps:
  - 300000
  - 400000
  - 500000
  anneal_rate: 0.3
step:
  total_step: 900000
  log_step: 100
  synth_step: 1000
  val_step: 1000
  save_step: 100000
